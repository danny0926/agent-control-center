name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTROL_CENTER_MODE: standalone
      CONTROL_CENTER_ALLOWED_ACTIONS: ''
      CONTROL_CENTER_DB: data/ci-control-center.db
      CONTROL_CENTER_BACKGROUND_ENABLED: '0'
      HERDR_ENV: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install API and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify API
        run: python -m pytest apps/api/tests
      - name: Verify frontend
        run: npm run test --workspace apps/web
      - name: Build frontend
        run: npm run build --workspace apps/web
      - name: Install isolated browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify synthetic browser scenarios
        run: npm run test:e2e
